# MacBook8,1 — macOS-like modifiers for the Apple SPI keyboard.
# Physical Command (Super) ↔ Control so ⌘C/⌘V match macOS muscle memory.
# Option (Alt) is left alone for us-mac / layout special characters.
#
# Installed by ultrathin_fix install-keyboard.sh

[ids]
*

[main]
leftmeta = leftcontrol
rightmeta = rightcontrol
leftcontrol = leftmeta
rightcontrol = rightmeta
